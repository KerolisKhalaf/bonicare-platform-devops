apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bonicare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: keroliskhalaf1/bonicare-backend:<COMMIT_SHA>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: bonicare-config
            - secretRef:
                name: bonicare-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: bonicare
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP