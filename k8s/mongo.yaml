apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: bonicare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mongo-pvc
---

apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: bonicare
spec:
  selector:
    app: mongo
  ports:
  - port: 27017
    targetPort: 27017
  type: ClusterIP