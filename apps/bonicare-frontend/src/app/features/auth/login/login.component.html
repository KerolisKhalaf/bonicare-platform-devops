<div class="auth-form">
  <div class="auth-form-header">
    <img src="/images/boniecare logo.png" class="auth-form-logo" alt="BoniCare Logo" />
    <h2>Sign in</h2>
    <p class="auth-form__subtitle">Access your BoniCare account</p>
  </div>

  @if (serverError()) {
    <div class="auth-alert auth-alert--error" role="alert">
      {{ serverError() }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <bc-input
      label="Email"
      type="email"
      formControlName="email"
      placeholder="you@example.com"
      [error]="fieldError('email')"
    />
    <bc-input
      label="Password"
      type="password"
      formControlName="password"
      placeholder="••••••••"
      [error]="fieldError('password')"
    />

    <bc-button type="submit" variant="primary" size="lg" [loading]="loading()" [disabled]="form.invalid">
      Sign in
    </bc-button>
  </form>

  <div class="google-auth-divider">
    <span>Or continue with</span>
  </div>

  <button type="button" class="google-auth-btn" (click)="onGoogleSignIn()">
    <img src="/images/google-icon.png" alt="Google" />
    <span>Sign in with Google</span>
  </button>

  <p class="auth-form__footer">
    Don't have an account? <a routerLink="/auth/signup">Create one</a>
  </p>
</div>
