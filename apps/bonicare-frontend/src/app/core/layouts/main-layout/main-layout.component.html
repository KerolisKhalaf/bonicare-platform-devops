<div class="layout">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="sidebar__brand">
      <img src="/images/boniecare logo.png" class="sidebar__logo-img" alt="BoniCare Logo" />
      <div>
        <strong>BoniCare</strong>
        <small>Healthcare Platform</small>
      </div>
    </div>

    <nav class="sidebar__nav">
      @for (item of visibleNav(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="sidebar__link--active"
          [routerLinkActiveOptions]="{ exact: item.path === '/patient' || item.path === '/doctor' || item.path === '/admin' }"
          class="sidebar__link"
        >
          @if (item.image) {
            <img [src]="item.image" class="sidebar__link-icon" aria-hidden="true" alt="" />
          } @else {
            <span class="sidebar__icon" aria-hidden="true">{{ item.icon }}</span>
          }
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__user">
        <img [src]="getUserAvatar()" class="sidebar__avatar" alt="User Avatar" />
        <div>
          <div class="sidebar__name">{{ user()?.name }}</div>
          <div class="sidebar__role">{{ user()?.role }}</div>
        </div>
      </div>
      <button class="sidebar__logout-btn" (click)="logout()">
        <img src="/images/Logout.png" class="sidebar__logout-icon" alt="Logout" />
        <span>Sign out</span>
      </button>
    </div>
  </aside>

  <div class="layout__main">
    <header class="header">
      <div class="header__brand">
        <img src="/images/boniecare small.png" class="header__logo" alt="BoniCare" />
        <h1 class="header__title">Welcome, {{ user()?.name }}</h1>
      </div>
      <div class="header__actions">
        <button type="button" class="icon-btn" (click)="toggleTheme()" [attr.aria-label]="themeMode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
          {{ themeMode() === 'dark' ? '☀️' : '🌙' }}
        </button>
        <bc-button variant="ghost" size="sm" (clicked)="logout()">Sign out</bc-button>
      </div>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
