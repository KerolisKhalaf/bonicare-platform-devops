
# ==========================
# Development Overrides for compose.yaml
# ==========================
# Run with: docker compose -f compose.yaml -f compose.dev.yaml up
# ==========================

services:
  frontend:
    build:
      target: builder
    ports:
      - "4200:4200"
    volumes:
      - ../apps/bonicare-frontend:/build
      - frontend_node_modules:/build/node_modules
    command: ["npm", "start", "--", "--host", "0.0.0.0", "--port", "4200"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4200/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  backend:
    volumes:
      - ../apps/bonicare-backend:/app
      - backend_node_modules:/app/node_modules
      - ../apps/bonicare-backend/uploads:/app/uploads
    command: ["npm", "run", "dev"]
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - DEBUG=*
    restart: unless-stopped

  ai-service:
    volumes:
      - ../apps/ai-service:/app
      - ../apps/ai-service/models:/app/models
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  webrtc:
    volumes:
      - ../apps/webrtc:/app
      - webrtc_node_modules:/app/node_modules
    command: ["node", "--watch", "server.js"]
    restart: unless-stopped

  mongo:
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_node_modules:
  webrtc_node_modules:
